<!DOCTYPE html>
<html lang="cs" data-variant-name="Corporate Luxury">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Šablona · Corporate Luxury</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --navy:#0F2C47;
  --navy-light:#1a3f5a;
  --brand:#C9A961;          /* přepisovatelné přes SITE.brand.color */
  --gold:var(--brand);
  --gold-light:#D4AF37;
  --silver:#E8E8E8;
  --cream:#F5F4F1;
  --text:#1a1a1a;
  --text-soft:#6B6B6B;
  --line:rgba(15,44,71,.12);
  --line-strong:#0F2C47;
  --deep:#0F2C47;                /* tmavá plocha: patička, CTA, telefonní karta */
  --on-deep:#FFFFFF;
  --on-gold:#0F2C47;             /* text na zlaté výplni — vždy tmavý */
  --card-bg:#FFFFFF;
  --card-line:rgba(15,44,71,.08);
  --card-shadow:rgba(15,44,71,.08);
  --caption-bg:rgba(255,255,255,.95);
  --ph-empty:rgba(15,44,71,.25);
  --nav-rgb:245,244,241;
  --map-filter:saturate(1.05);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Lato',system-ui,sans-serif;
  --nav-h:64px;
  --ease:cubic-bezier(.2,.8,.3,1);
  color-scheme:light;
}
/* ============ NOČNÍ TÉMA ============
   Prémiová atmosféra po setmění: hluboká modř místo krému, zlatá
   zůstává jediným akcentem. „Navy" se v noci stává barvou textu,
   tmavé plochy proto berou vlastní token --deep. */
html[data-theme="dark"]{
  --cream:#0C1822;
  --navy:#E9EFF5;
  --navy-light:#C6D4E0;
  --gold:var(--brand);
  --gold:color-mix(in srgb, var(--brand) 88%, #FFFFFF);
  --silver:#3A434B;
  --text:#E9EFF5;
  --text-soft:#9BA8B4;
  --line:rgba(233,239,245,.14);
  --line-strong:rgba(233,239,245,.28);
  --deep:#122430;
  --on-deep:#F2F6FA;
  --card-bg:#132230;
  --card-line:rgba(233,239,245,.1);
  --card-shadow:rgba(0,0,0,.45);
  --caption-bg:rgba(19,34,48,.92);
  --ph-empty:rgba(233,239,245,.25);
  --nav-rgb:12,24,34;
  --map-filter:invert(.92) hue-rotate(180deg) saturate(.6) contrast(.9);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{
  background:var(--cream);
  color:var(--text);
  transition:background-color .3s,color .3s;
  font-family:var(--sans);
  font-weight:400;
  line-height:1.7;
  overflow-x:hidden;
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.1;letter-spacing:-.01em}

/* ============ NAV ============ */
nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;transition:background .35s,box-shadow .35s;
  background:rgba(var(--nav-rgb),0);
}
nav.scrolled{
  background:rgba(var(--nav-rgb),.96);
  backdrop-filter:blur(12px);
  box-shadow:0 1px 0 var(--line-strong);
}
nav .logo{
  font-family:var(--serif);font-weight:700;font-size:1.28rem;
  color:var(--navy);text-decoration:none;letter-spacing:.02em;
}
nav .logo span{color:var(--gold)}
nav .right{display:flex;align-items:center;gap:24px}
nav .links{display:none;gap:28px}
nav .links a{
  color:var(--text-soft);text-decoration:none;font-family:var(--sans);
  font-weight:400;font-size:.95rem;transition:color .25s;
}
nav .links a:hover{color:var(--gold)}
@media(min-width:768px){nav .links{display:flex}}
.lang-toggle{
  display:flex;border:1px solid var(--line-strong);border-radius:4px;
  overflow:hidden;background:var(--cream);
}
.lang-toggle button{
  background:none;border:0;padding:6px 14px;cursor:pointer;
  font-family:var(--sans);font-size:.85rem;font-weight:500;
  color:var(--text-soft);transition:.2s;
}
.lang-toggle button.active{background:var(--gold);color:var(--on-gold)}

/* přepínač tématu — stejný rámeček a rádius jako jazyk */
.theme-btn{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;padding:0;cursor:pointer;border-radius:4px;
  border:1px solid var(--line-strong);background:var(--card-bg);color:var(--navy);
  transition:background .25s,color .25s,border-color .25s;
}
.theme-btn:hover{border-color:var(--gold);color:var(--gold)}
.theme-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .i-sun{display:none}
html[data-theme="dark"] .theme-btn .i-moon{display:none}
html[data-theme="dark"] .theme-btn .i-sun{display:block}

/* ============ HERO ============ */
.hero{
  position:relative;min-height:100svh;display:flex;align-items:center;
  padding:calc(var(--nav-h) + 40px) 28px 60px;overflow:hidden;
  background:linear-gradient(135deg,var(--cream) 0%,rgba(201,169,97,.04) 100%);
}
.hero__accent{
  position:absolute;width:400px;height:400px;border-radius:50%;
  opacity:.08;pointer-events:none;background:var(--gold);
}
.hero__accent.a1{top:-8%;right:-5%}
.hero__accent.a2{bottom:8%;left:-10%}
.hero__grid{
  position:relative;max-width:1200px;margin:0 auto;width:100%;
  display:grid;gap:56px;align-items:center;
}
@media(min-width:900px){.hero__grid{grid-template-columns:1.1fr .9fr;gap:80px}}
.hero__label{
  display:inline-block;font-family:var(--sans);font-weight:500;font-size:.82rem;
  color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;
}
.hero h1{
  font-size:clamp(3.2rem,10vw,5.2rem);color:var(--navy);margin-bottom:20px;
}
.hero h1 .word{display:inline-block;margin-right:.2em}
.hero__sub{
  color:var(--text-soft);font-size:clamp(.95rem,2.2vw,1.1rem);
  font-weight:300;max-width:42ch;line-height:1.8;margin-bottom:32px;
}
.hero__cta{
  display:inline-flex;align-items:center;gap:12px;padding:16px 36px;
  border-radius:2px;background:var(--deep);color:var(--on-deep);text-decoration:none;
  font-family:var(--sans);font-weight:500;font-size:1rem;
  border:1px solid var(--deep);transition:all .3s var(--ease);
  box-shadow:0 4px 16px rgba(15,44,71,.12);
}
.hero__cta:hover{
  background:var(--gold);border-color:var(--gold);
  transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,44,71,.16);
}
.hero__photo{position:relative;display:flex;align-items:center;justify-content:center}
.hero__photo .frame{
  overflow:hidden;border-radius:8px;border:1px solid var(--card-line);
  box-shadow:0 16px 56px rgba(15,44,71,.14);
}
.hero__photo img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.hero__badge{
  position:absolute;top:-20px;right:-12px;z-index:3;
  background:var(--gold);border:none;color:var(--on-gold);
  border-radius:4px;padding:12px 20px;
  font-family:var(--serif);font-weight:700;font-size:.95rem;line-height:1.3;
  text-align:center;box-shadow:0 8px 24px rgba(201,169,97,.25);
}
.hero__badge b{display:block;font-size:1.4rem;color:var(--on-gold)}
.scroll-hint{
  position:absolute;bottom:24px;left:0;right:0;text-align:center;
  font-family:var(--sans);font-weight:300;font-size:.85rem;color:var(--text-soft);
}
.scroll-hint .bounce{display:inline-block;animation:bounceDown 1.8s ease-in-out infinite}
@keyframes bounceDown{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* ============ DIVIDER LINE ============ */
.divider-line{
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:80px 0;max-width:1200px;margin-left:auto;margin-right:auto;
}

/* ============ GENERIC SECTION ============ */
section{padding:100px 28px;max-width:1200px;margin:0 auto}
.section__label{
  display:inline-block;font-family:var(--sans);font-weight:500;font-size:.8rem;
  color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;
}
.section h2{font-size:clamp(2rem,6vw,3.6rem);margin-bottom:16px;color:var(--navy)}
.section__lead{
  color:var(--text-soft);font-weight:300;max-width:60ch;font-size:1.05rem;
  line-height:1.8;margin-bottom:36px;
}
.menu-sec,.visit-sec,.gallery-sec{overflow-x:clip}

/* ============ GALLERY (carousel, elegant) ============ */
.gallery-sec{
  max-width:none;background:var(--card-bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:100px 28px;
}
.gallery-inner{max-width:1200px;margin:0 auto}
.carousel{position:relative;margin-top:48px}
.carousel__viewport{
  overflow:hidden;border-radius:8px;
  border:1px solid var(--card-line);
  background:var(--card-bg);cursor:grab;touch-action:pan-y;-webkit-user-select:none;
  box-shadow:0 12px 48px rgba(15,44,71,.08);
}
.carousel__viewport.dragging{cursor:grabbing}
.carousel__track{display:flex;transition:transform .6s var(--ease);will-change:transform}
.carousel__slide{flex:0 0 100%;position:relative;aspect-ratio:4/3;user-select:none}
@media(min-width:900px){.carousel__slide{aspect-ratio:16/9}}
.carousel__slide img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.carousel__slide figcaption{
  position:absolute;left:24px;bottom:20px;
  background:var(--caption-bg);backdrop-filter:blur(8px);
  border-radius:4px;font-family:var(--serif);font-weight:600;
  font-size:.92rem;color:var(--navy);padding:8px 20px;
  box-shadow:0 4px 12px rgba(15,44,71,.1);
}
.carousel__btn{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:48px;height:48px;border-radius:4px;border:1px solid var(--gold);
  background:var(--card-bg);color:var(--gold);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(15,44,71,.1);
  transition:all .3s var(--ease);
}
.carousel__btn:hover{background:var(--gold);color:var(--on-gold);transform:translateY(-50%) scale(1.1)}
.carousel__btn:disabled{opacity:.4;cursor:default}
.carousel__btn--prev{left:20px}
.carousel__btn--next{right:20px}
.carousel__dots{display:flex;justify-content:center;gap:8px;margin-top:24px}
.carousel__dot{
  width:10px;height:10px;border-radius:50%;border:1px solid var(--gold);padding:0;cursor:pointer;
  background:transparent;transition:all .3s var(--ease);
}
.carousel__dot.active{background:var(--gold);transform:scale(1.2)}
.carousel__counter{
  position:absolute;top:-36px;right:0;z-index:3;
  color:var(--text-soft);font-family:var(--sans);font-weight:500;font-size:.85rem;
}

/* ============ MENU ============ */
.menu-cats{
  position:sticky;top:var(--nav-h);z-index:5;background:var(--cream);
  display:flex;gap:8px;margin:36px 0 48px;padding:12px 0;
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.menu-cats::-webkit-scrollbar{display:none}
.menu-cat{
  flex:0 0 auto;border:1px solid var(--line-strong);background:var(--card-bg);cursor:pointer;
  border-radius:4px;font-family:var(--sans);font-size:.9rem;font-weight:500;
  color:var(--text-soft);padding:10px 20px;transition:.2s;white-space:nowrap;
}
.menu-cat:hover{border-color:var(--gold);color:var(--gold)}
.menu-cat.active{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.menu-group{margin-bottom:48px}
.menu-group h3{font-size:clamp(1.4rem,3.5vw,2rem);margin-bottom:12px;color:var(--navy)}
.menu-note{
  background:rgba(201,169,97,.06);border:1px solid rgba(201,169,97,.2);border-radius:6px;
  padding:16px 20px;font-size:.9rem;font-weight:300;color:var(--text-soft);
  margin:0 0 28px;max-width:70ch;
}
.menu-items{display:grid;gap:20px}
@media(min-width:680px){.menu-items{grid-template-columns:1fr 1fr}}
.menu-item{
  background:var(--card-bg);border:1px solid var(--card-line);border-radius:6px;
  padding:16px;display:flex;flex-direction:column;gap:12px;
  opacity:0;transform:translateY(20px) scale(.97);
  transition:opacity .5s var(--ease),transform .5s var(--ease),box-shadow .2s;
}
.menu-item.in{opacity:1;transform:none}
.menu-item:hover{box-shadow:0 8px 24px rgba(15,44,71,.08);border-color:rgba(201,169,97,.3)}
.menu-item__ph{width:100%;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:var(--cream)}
.menu-item__ph img{width:100%;height:100%;object-fit:cover}
.menu-item__ph--empty{
  border:1px dashed var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--ph-empty);
  font-size:1.8rem;
}
.menu-item__body{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 2px}
.menu-item__body b{font-family:var(--sans);font-weight:500;font-size:.95rem;display:block;line-height:1.4}
.menu-item__price{
  flex:0 0 auto;font-family:var(--serif);font-weight:700;color:var(--gold);
  font-size:1.05rem;white-space:nowrap;
}
.allergens{font-size:.8rem;font-weight:400;color:var(--text-soft);line-height:1.9;margin-top:10px}
.allergens b{color:var(--text)}

/* ============ VISIT ============ */
.visit{display:grid;gap:48px;margin-top:40px}
@media(min-width:900px){.visit{grid-template-columns:1fr 1fr;gap:80px;align-items:start}}
.info-card{
  background:var(--card-bg);border:1px solid var(--card-line);border-radius:6px;
  padding:32px;margin-bottom:24px;box-shadow:0 4px 12px rgba(15,44,71,.04);
  transition:all .3s var(--ease);
}
.info-card:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(15,44,71,.08)}
.info-card h3{font-size:1.15rem;margin-bottom:16px;display:flex;align-items:center;gap:12px;color:var(--navy)}
.info-card h3 svg{flex:0 0 auto;color:var(--gold);width:20px;height:20px;stroke-width:1.5}
.hours-list{list-style:none}
.hours-list li{
  display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);
  font-size:.95rem;font-weight:300;
}
.hours-list li:last-child{border:0}
.hours-list .today{color:var(--gold);font-weight:500}
.addr{font-size:1.02rem;font-weight:300;line-height:1.8}
.addr a{color:var(--gold);font-weight:400;text-decoration:none;transition:.2s}
.addr a:hover{opacity:.8}
.info-card.phone-card{
  background:var(--deep);border-color:var(--deep);color:var(--on-deep);box-shadow:0 8px 24px var(--card-shadow);
}
.info-card.phone-card h3{color:var(--on-deep)}
.info-card.phone-card h3 svg{color:var(--gold)}
.phone-big{
  color:var(--on-deep);font-family:var(--serif);font-size:1.6rem;font-weight:700;
  text-decoration:none;letter-spacing:.02em;
}
.map-wrap{
  border:1px solid var(--card-line);border-radius:6px;overflow:hidden;
  aspect-ratio:4/3;background:var(--card-bg);box-shadow:0 8px 24px rgba(15,44,71,.08);
}
.map-wrap iframe{width:100%;height:100%;border:0;filter:var(--map-filter)}

/* ============ FOOTER ============ */
.footer-wave{display:block;width:100%;margin-bottom:-1px;color:var(--deep)}
footer{
  background:var(--deep);color:rgba(245,244,241,.75);padding:56px 28px 44px;text-align:center;
}
footer .flogo{
  font-family:var(--serif);font-weight:700;font-size:1.8rem;color:var(--on-deep);margin-bottom:8px;
}
footer .flogo span{color:var(--gold)}
footer p{font-size:.9rem;font-weight:300;margin:5px 0}
footer a{color:var(--on-deep);text-decoration:none;transition:.2s;border-bottom:1px solid rgba(245,244,241,.2)}
footer a:hover{color:var(--gold);border-bottom-color:var(--gold)}
footer .tiny{margin-top:24px;font-size:.75rem;font-weight:300;color:rgba(245,244,241,.5)}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .menu-item{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
<script src="cfg.kavarna.js"></script>
<script src="../_engine/theme.js"></script>
</head>
<body>

<nav id="nav">
  <a class="logo" href="#top" data-site-split="brand.name"></a>
  <div class="right">
    <div class="links">
      <a href="#galerie" data-cs="Galerie" data-en="Gallery">Galerie</a>
      <a href="#nabidka" data-cs="Nabídka" data-en="Menu">Nabídka</a>
      <a href="#navsteva" data-cs="Návštěva" data-en="Visit">Návštěva</a>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="btn-cs" class="active" onclick="setLang('cs')">CZ</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Přepnout téma / Toggle theme" title="Přepnout téma">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</nav>

<main id="top">

  <!-- HERO -->
  <header class="hero">
    <div class="hero__accent a1"></div>
    <div class="hero__accent a2"></div>
    <div class="hero__grid">
      <div>
        <p class="hero__label" data-site="hero.kicker"></p>
        <h1 id="heroTitle" data-site-letters="brand.name"></h1>
        <p class="hero__sub" data-site="hero.sub"></p>
        <a class="hero__cta" href="#navsteva">
          <span data-cs="Navštivte nás" data-en="Visit us">Navštivte nás</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </a>
      </div>
      <div class="hero__photo">
        <div class="hero__badge" data-site-if="rating">
          <b>★ <span data-site="rating.score"></span></b>
          <span><span data-site="rating.count"></span> <span data-cs="recenzí" data-en="reviews">recenzí</span></span>
        </div>
        <div class="frame"><img data-site-src="hero.image" data-site-alt="hero.imageAlt" alt=""></div>
      </div>
    </div>
    <div class="scroll-hint"><span class="bounce">↓</span></div>
  </header>

  <div class="divider-line"></div>

  <!-- GALLERY — carousel -->
  <section id="galerie" class="gallery-sec">
    <div class="gallery-inner">
      <p class="section__label anim-pop" data-cs="Galerie" data-en="Gallery">Galerie</p>
      <h2 class="anim-pop" data-cs="Chvíle z kavárny" data-en="Moments from the café">Chvíle z kavárny</h2>
      <p class="section__lead anim-pop" data-cs="Listujte obrázky pro více dojmů." data-en="Browse images for more impressions.">Listujte obrázky pro více dojmů.</p>
      <div class="carousel anim-pop">
        <div class="carousel__counter" id="carCounter">1 / 6</div>
        <button class="carousel__btn carousel__btn--prev" id="carPrev" aria-label="Předchozí">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="carousel__btn carousel__btn--next" id="carNext" aria-label="Další">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="carousel__viewport" id="carViewport">
          <div class="carousel__track" id="carTrack">
          </div>
        </div>
        <div class="carousel__dots" id="carDots"></div>
      </div>
    </div>
  </section>

  <div class="divider-line"></div>

  <!-- MENU — full menu with prices & photos -->

<script>
/* ===== Animírované prvky specifické pro tuto šablonu ===== */
if(window.gsap && window.ScrollTrigger){
  gsap.registerPlugin(ScrollTrigger);
  const mm=gsap.matchMedia();
  mm.add('(prefers-reduced-motion: no-preference)',()=>{

    gsap.from('#heroTitle',{y:60,opacity:0,duration:.8,ease:'power3.out',delay:.2});
    gsap.from('.hero__label',{opacity:0,y:16,duration:.6,ease:'power2.out',delay:.1});
    gsap.from('.hero__sub',{opacity:0,y:20,duration:.7,delay:.4,ease:'power2.out'});
    gsap.from('.hero__cta',{opacity:0,y:20,scale:.95,duration:.7,delay:.6,ease:'back.out(1.5)'});
    gsap.from('.hero__photo .frame',{opacity:0,scale:.9,duration:.8,delay:.4,ease:'power3.out'});
    gsap.from('.hero__badge',{scale:0,opacity:0,duration:.6,delay:.9,ease:'back.out(1.8)'});

    document.querySelectorAll('.anim-pop').forEach(el=>{
      gsap.from(el,{opacity:0,y:30,scale:.96,duration:.6,ease:'power2.out',
        scrollTrigger:{trigger:el,start:'top 82%'}});
    });
  });
}

<script>
/* zoom hero fotky při scrollu: cíl sleduje scrollY, aktuální hodnota se k němu po
   snímcích dotahuje — pohyb je pak měkčí než přímé mapování na scroll
   (stejné chování jako u varianty Warm Paper) */
(function(){
  var img = document.querySelector('img[data-site-src="hero.image"]');
  if (!img) return;
  var target = 0, current = 0, rafId = null;
  function frame(){
    current += (target - current) * 0.25;
    if (Math.abs(target - current) < 0.1) current = target;
    if (current < innerHeight) img.style.transform = 'scale(' + (1 + current * .0003) + ')';
    if (current !== target) rafId = requestAnimationFrame(frame); else rafId = null;
  }
  addEventListener('scroll', function(){
    target = scrollY;
    if (rafId === null) rafId = requestAnimationFrame(frame);
  }, { passive: true });
})();
</script>
